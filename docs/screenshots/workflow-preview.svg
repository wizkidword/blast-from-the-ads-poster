<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Blast From the Ads workflow</title>
  <desc id="description">A four step local-first workflow: bring in media, process it, review it, and export an integrity-checked posting pack.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1080" cy="52" r="220" fill="#1e40af" opacity=".17"/>
  <circle cx="70" cy="610" r="245" fill="#0ea5e9" opacity=".09"/>
  <text x="72" y="79" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="35" font-weight="700">Blast From the Ads</text>
  <text x="72" y="114" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="19">A local-first workflow for reviewable social posting packs</text>
  <line x1="72" y1="143" x2="1128" y2="143" stroke="#475569" stroke-width="1"/>
  <g filter="url(#shadow)">
    <rect x="72" y="205" width="240" height="254" rx="18" fill="#f8fafc"/>
    <rect x="336" y="205" width="240" height="254" rx="18" fill="#f8fafc"/>
    <rect x="600" y="205" width="240" height="254" rx="18" fill="#f8fafc"/>
    <rect x="864" y="205" width="264" height="254" rx="18" fill="#f8fafc"/>
  </g>
  <g fill="url(#accent)">
    <circle cx="105" cy="239" r="19"/>
    <circle cx="369" cy="239" r="19"/>
    <circle cx="633" cy="239" r="19"/>
    <circle cx="897" cy="239" r="19"/>
  </g>
  <g fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <text x="105" y="245">1</text>
    <text x="369" y="245">2</text>
    <text x="633" y="245">3</text>
    <text x="897" y="245">4</text>
  </g>
  <g fill="#0f172a" font-family="Segoe UI, Arial, sans-serif">
    <text x="105" y="293" font-size="24" font-weight="700">Bring in media</text>
    <text x="369" y="293" font-size="24" font-weight="700">Process locally</text>
    <text x="633" y="293" font-size="24" font-weight="700">Review deliberately</text>
    <text x="897" y="293" font-size="24" font-weight="700">Export with confidence</text>
  </g>
  <g fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="17">
    <text x="105" y="331">Add images and video</text>
    <text x="105" y="357">to your local inbox.</text>
    <text x="369" y="331">Prepare vertical media,</text>
    <text x="369" y="357">draft copy, record the run.</text>
    <text x="633" y="331">Edit captions, inspect</text>
    <text x="633" y="357">readiness, resolve failures.</text>
    <text x="897" y="331">Create a complete pack</text>
    <text x="897" y="357">for manual platform upload.</text>
  </g>
  <g stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 316 332 H 329"/>
    <path d="M 580 332 H 593"/>
    <path d="M 844 332 H 857"/>
  </g>
  <g fill="#64748b">
    <path d="M329 325 L339 332 L329 339 Z"/>
    <path d="M593 325 L603 332 L593 339 Z"/>
    <path d="M857 325 L867 332 L857 339 Z"/>
  </g>
  <g fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">
    <text x="72" y="552">Your media stays under your control</text>
    <text x="72" y="583" fill="#94a3b8" font-size="15" font-weight="400">No automatic publishing · Optional AI assistance · Integrity-checked manual export</text>
  </g>
  <rect x="951" y="530" width="177" height="42" rx="21" fill="#1d4ed8"/>
  <text x="1039" y="557" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">WINDOWS DESKTOP</text>
</svg>
