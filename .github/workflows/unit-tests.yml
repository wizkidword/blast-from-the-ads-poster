name: Unit tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-windows-py313.txt
      - run: python scripts/repo_hygiene.py
      - run: python -m unittest discover -s tests

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-windows-py313.txt
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q scripts tests
      - run: cmd /c Build-Standalone-Exe.bat
      - run: .\dist\BlastFromTheAds.exe --smoke-test
      - run: |
          if (-not (Test-Path dist\release-metadata\SHA256SUMS.txt)) { throw "Release checksums were not generated." }
          if (-not (Test-Path dist\release-metadata\sbom.spdx.json)) { throw "Release SBOM was not generated." }
      - uses: actions/upload-artifact@v4
        with:
          name: BlastFromTheAds-windows
          path: |
            dist/BlastFromTheAds-package
            dist/release-metadata
