name: Bug report
description: Tell us about a reproducible problem without sharing private media or secrets.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include API keys, private media, customer information, posting packs, or unredacted local paths.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Use the application version, Git commit, or release package date.
      placeholder: "For example: 4.4.0 or a1b2c3d"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Sanitized environment
      description: Include Windows, Python, and FFmpeg/FFprobe versions if relevant. Remove user names and private paths.
      placeholder: |
        Windows 11 23H2
        Python 3.13.x
        FFmpeg 7.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use safe sample files and placeholder paths.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste redacted error text or screenshots only.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys, real media, customer information, and private paths.
          required: true
